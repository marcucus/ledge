name: Quality

on:
  push:
    branches: [dev, rc, main]
  pull_request:
    branches: [dev, rc, main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Build, tests and SwiftLint
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release labels
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        shell: zsh {0}
        run: |
          labels=("${(@f)$(jq -r '.pull_request.labels[]?.name' "$GITHUB_EVENT_PATH")}")
          bump=$(Scripts/resolve-version-bump.sh "${labels[@]}")
          echo "Version bump: $bump"

      - name: Test release automation
        run: make test-release-automation

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-xcode-16.4-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-16.4-spm-

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install SwiftLint
        run: brew list swiftlint >/dev/null 2>&1 || brew install swiftlint

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Lint
        run: swiftlint lint --quiet Sources Tests

      - name: Build application bundle
        run: make app DEV_SIGN=-

      - name: Verify application bundle
        run: |
          Scripts/verify-app-bundle.sh dist/Ledge.app
          test -f dist/Ledge.app/Contents/Resources/en.lproj/InfoPlist.strings
          test -f dist/Ledge.app/Contents/Resources/fr.lproj/InfoPlist.strings
          test -f dist/Ledge.app/Contents/Resources/Sparkle-LICENSE.txt
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/Ledge.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" dist/Ledge.app/Contents/Info.plist
          cmp .build/checkouts/Sparkle/LICENSE dist/Ledge.app/Contents/Resources/Sparkle-LICENSE.txt
