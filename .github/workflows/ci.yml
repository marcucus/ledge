name: Quality

on:
  push:
    branches: [dev, rc, main]
  pull_request:
    branches: [dev, rc, main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Build, tests and SwiftLint
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Toolchain
        run: swift --version

      - name: Install SwiftLint
        run: brew list swiftlint >/dev/null 2>&1 || brew install swiftlint

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Lint
        run: swiftlint lint --quiet Sources Tests

      - name: Build application bundle
        run: make app DEV_SIGN=-

      - name: Verify application bundle
        run: |
          test -x dist/Ledge.app/Contents/MacOS/Ledge
          test -f dist/Ledge.app/Contents/Resources/en.lproj/InfoPlist.strings
          test -f dist/Ledge.app/Contents/Resources/fr.lproj/InfoPlist.strings
          test -f dist/Ledge.app/Contents/Resources/Sparkle-LICENSE.txt
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/Ledge.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" dist/Ledge.app/Contents/Info.plist
          cmp .build/checkouts/Sparkle/LICENSE dist/Ledge.app/Contents/Resources/Sparkle-LICENSE.txt
          codesign --verify --deep --strict dist/Ledge.app
